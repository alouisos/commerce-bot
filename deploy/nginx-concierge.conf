# Concierge - nginx reverse proxy in front of the Next.js server on :3100.
#
# Deliberately NOT `default_server` (same host also serves Milian Jo). Replace
# SERVER_NAME_PLACEHOLDER with the app hostname (APP_HOST) when installing,
# e.g.  sed 's/SERVER_NAME_PLACEHOLDER/app.example.com/' ...
# Certbot edits this file in place to add the :443 block; do not overwrite it
# once it holds a certificate.

# This file is included inside the `http` context (sites-enabled), so the map is valid here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_PLACEHOLDER;

    server_tokens off;
    # Public endpoints take small bodies; only the admin (/app, document uploads) needs large ones.
    client_max_body_size 1m;

    # Admin pages, including document uploads through server actions (up to 20 MB).
    location /app/ {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append: rate limiting trusts the leftmost entry, which a client could otherwise forge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The widget API: the largest legitimate request is a chat message with its page context (~200 KB).
    location /api/widget/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Widget chat is Server-Sent Events: never buffer, allow long streams.
    location /api/widget/chat {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append: rate limiting trusts the leftmost entry, which a client could otherwise forge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # The embeddable script: short cache so widget fixes reach customer sites quickly.
    location = /widget.js {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append: rate limiting trusts the leftmost entry, which a client could otherwise forge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
